name: Actualizar datos

# Horarios de Argentina (UTC-3, sin horario de verano):
#   - 10:30 y 15:05, días hábiles: dólar y riesgo país (apertura y cierre del mercado)
#   - 8:00 y 19:00, lunes, miércoles y viernes: actualización completa (INDEC, ANSES,
#     Presupuesto Abierto, consumo, préstamos, dólar y riesgo país). La de las 19:00
#     alcanza los informes del INDEC del mismo día, que salen alrededor de las 16:00;
#     la de las 8:00 deja todo al día antes de que arranque la jornada.
# GitHub puede demorar las tareas programadas entre 5 y 20 minutos.
# También se puede correr a mano desde la pestaña Actions ("Run workflow").
on:
  schedule:
    - cron: "0 11 * * 1,3,5"  # 8:00 ART
    - cron: "30 13 * * 1-5"   # 10:30 ART
    - cron: "5 18 * * 1-5"    # 15:05 ART
    - cron: "0 22 * * 1,3,5"  # 19:00 ART
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué actualizar"
        type: choice
        options: [completo, dolar]
        default: completo

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Elegir qué actualizar
        id: modo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then m="${{ inputs.modo }}"
          elif [ "${{ github.event.schedule }}" = "0 11 * * 1,3,5" ] || [ "${{ github.event.schedule }}" = "0 22 * * 1,3,5" ]; then m="completo"
          else m="dolar"; fi
          echo "modo=$m" >> "$GITHUB_OUTPUT"
          echo "Modo de esta corrida: $m"

      - name: Recuperar los archivos del presupuesto ya descargados
        if: steps.modo.outputs.modo == 'completo'
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: presupuesto-v1-${{ github.run_id }}
          restore-keys: presupuesto-v1-

      - name: Descargar datos
        run: |
          if [ "${{ steps.modo.outputs.modo }}" = "dolar" ]; then args="--solo-dolar"; else args=""; fi
          # dos intentos: las fuentes a veces fallan un rato
          python pipeline/fetch.py $args || { echo "Falló la descarga, reintento en 2 minutos..."; sleep 120; python pipeline/fetch.py $args; }

      - name: Controlar los datos
        run: python pipeline/validar.py

      - name: Guardar los datos en el repositorio
        run: |
          python pipeline/combinar.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data datos.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos: actualización ${{ steps.modo.outputs.modo }} del $(TZ=America/Argentina/Buenos_Aires date +%Y-%m-%d)"
            git push
          fi

      - name: Preparar la publicación
        run: |
          mkdir -p _site
          cp datos.json _site/
          cp -r data _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
