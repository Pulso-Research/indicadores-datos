name: Actualizar datos

# Corre todos los días a las 9:00 de Argentina (12:00 UTC):
#   - días 15, 16 y 17: actualización completa (INDEC, ANSES, Presupuesto Abierto y dólar).
#     El 16 y el 17 son de resguardo, por si el INDEC publica algún dato después del 15.
#   - el resto de los días hábiles: dólar y riesgo país
#   - sábados y domingos (salvo del 15 al 17): no hace nada
# También se puede correr a mano desde la pestaña Actions ("Run workflow").
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué actualizar"
        type: choice
        options: [completo, dolar]
        default: completo

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Elegir qué actualizar
        id: modo
        run: |
          dia=$(TZ=America/Argentina/Buenos_Aires date +%d)
          semana=$(TZ=America/Argentina/Buenos_Aires date +%u)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then m="${{ inputs.modo }}"
          elif [ "$dia" = "15" ] || [ "$dia" = "16" ] || [ "$dia" = "17" ]; then m="completo"
          elif [ "$semana" -le 5 ]; then m="dolar"
          else m="nada"; fi
          echo "modo=$m" >> "$GITHUB_OUTPUT"
          echo "Modo de esta corrida: $m"

      - name: Descargar datos
        if: steps.modo.outputs.modo != 'nada'
        run: |
          if [ "${{ steps.modo.outputs.modo }}" = "dolar" ]; then
            python pipeline/fetch.py --solo-dolar
          else
            python pipeline/fetch.py
          fi

      - name: Controlar los datos
        if: steps.modo.outputs.modo != 'nada'
        run: python pipeline/validar.py

      - name: Guardar los datos en el repositorio
        if: steps.modo.outputs.modo != 'nada'
        run: |
          python pipeline/combinar.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data datos.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos: actualización ${{ steps.modo.outputs.modo }} del $(TZ=America/Argentina/Buenos_Aires date +%Y-%m-%d)"
            git push
          fi

      - name: Preparar la publicación
        if: steps.modo.outputs.modo != 'nada'
        run: |
          mkdir -p _site
          cp datos.json _site/
          cp -r data _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: steps.modo.outputs.modo != 'nada'
        with:
          path: _site

      - name: Publicar en GitHub Pages
        id: deploy
        if: steps.modo.outputs.modo != 'nada'
        uses: actions/deploy-pages@v4
